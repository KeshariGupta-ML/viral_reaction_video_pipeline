<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background: transparent;
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 850px;
    }
    .comment-card {
      background: rgba(18, 24, 38, 0.94);
      backdrop-filter: blur(16px);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      color: #fff;
    }
    .avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #38bdf8;
    }
  </style>
</head>
<body>
  <div class="comment-card p-4">
    <div class="d-flex align-items-center mb-3">
      <img src="{{ avatar_url or 'https://api.dicebear.com/7.x/identicon/svg?seed=' + author }}" class="avatar me-3" alt="Avatar">
      <div>
        <h5 class="mb-0 fw-bold text-info">{{ author }}</h5>
        <small class="text-white-50">Top Comment • 🔥 Most Liked</small>
      </div>
    </div>
    <p class="fs-4 fw-semibold lh-sm text-light mb-3">"{{ comment_text }}"</p>
    <div class="d-flex align-items-center gap-4 text-white-50 fs-6">
      <span><i class="bi bi-heart-fill text-danger me-1"></i> {{ likes }}</span>
      <span><i class="bi bi-chat-dots-fill me-1"></i> {{ replies }} replies</span>
    </div>
  </div>
</body>
</html>
