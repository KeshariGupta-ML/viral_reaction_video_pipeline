<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viral Reaction Video Generator Studio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="bg-black text-light py-5">
  <div class="container" style="max-width: 900px;">
    <div class="text-center mb-5">
      <h1 class="fw-bold text-info"><i class="bi bi-camera-reels-fill me-2"></i>Viral Reaction Studio</h1>
      <p class="text-secondary">End-to-End Automated 9:16 Shorts & Reels Generator with Gemini 2.5 Flash & FFmpeg</p>
    </div>

    <div class="row g-4">
      <div class="col-lg-6">
        <div class="glass-card p-4 h-100">
          <h4 class="mb-3"><i class="bi bi-link-45deg me-2"></i>Source Ingestion</h4>
          <form id="renderForm">
            <div class="mb-3">
              <label class="form-label text-white-50">Video URL (TikTok / Shorts / Reels)</label>
              <input type="url" id="video_url" name="video_url" class="form-control bg-dark text-white border-secondary" placeholder="https://www.youtube.com/shorts/..." required>
            </div>

            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label text-white-50">Voice Style</label>
                <select name="voice_style" class="form-select bg-dark text-white border-secondary">
                  <option value="hinglish_energetic">Hinglish - High Energy Roast</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label text-white-50">Comments Count</label>
                <input type="number" name="comment_count" class="form-control bg-dark text-white border-secondary" value="3" min="1" max="5">
              </div>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-info w-100 fw-bold mt-3 py-2">
              <i class="bi bi-play-circle me-2"></i>Generate Reaction Short
            </button>
          </form>
        </div>
      </div>

      <div class="col-lg-6">
        <div class="glass-card p-4 h-100 d-flex flex-column align-items-center justify-content-center text-center">
          <div id="statusArea">
            <i class="bi bi-film fs-1 text-white-50 mb-3"></i>
            <h5 class="text-secondary">Pipeline Output</h5>
            <p class="small text-white-50">Submit a video link to begin downloading, curating comments, and rendering your 9:16 video.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('renderForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const formData = new FormData(this);
      const submitBtn = document.getElementById('submitBtn');
      const statusArea = document.getElementById('statusArea');

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Queueing Job...`;

      statusArea.innerHTML = `
        <div class="spinner-border text-info mb-3" role="status"></div>
        <h5 class="text-info">Pipeline Initialized</h5>
        <p class="small text-white-50">Processing background tasks...</p>
      `;

      try {
        const response = await fetch('/api/generate', { method: 'POST', body: formData });
        const data = await response.json();

        if (response.ok) {
          pollJobStatus(data.job_id);
        } else {
          alert(data.detail || "Failed to start job");
          submitBtn.disabled = false;
          submitBtn.innerHTML = `<i class="bi bi-play-circle me-2"></i>Generate Reaction Short`;
        }
      } catch (err) {
        console.error(err);
        alert("An error occurred while submitting the request.");
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i class="bi bi-play-circle me-2"></i>Generate Reaction Short`;
      }
    });

    async function pollJobStatus(jobId) {
      const statusArea = document.getElementById('statusArea');
      const submitBtn = document.getElementById('submitBtn');

      const interval = setInterval(async () => {
        try {
          const res = await fetch(`/api/job/${jobId}`);
          const job = await res.json();

          if (job.status === 'completed') {
            clearInterval(interval);
            submitBtn.disabled = false;
            submitBtn.innerHTML = `<i class="bi bi-play-circle me-2"></i>Generate Reaction Short`;

            statusArea.innerHTML = `
              <h5 class="text-success mb-3"><i class="bi bi-check-circle-fill me-2"></i>Render Complete!</h5>
              <video width="100%" controls style="max-height: 350px; border-radius: 12px;" class="mb-3">
                <source src="${job.rendered_video_url}" type="video/mp4">
                Your browser does not support the video tag.
              </video>
              <a href="${job.rendered_video_url}" download class="btn btn-success w-100 fw-bold">
                <i class="bi bi-download me-2"></i>Download 9:16 Video
              </a>
            `;
          } else if (job.status === 'failed') {
            clearInterval(interval);
            submitBtn.disabled = false;
            submitBtn.innerHTML = `<i class="bi bi-play-circle me-2"></i>Generate Reaction Short`;

            statusArea.innerHTML = `
              <h5 class="text-danger mb-2"><i class="bi bi-x-circle-fill me-2"></i>Render Failed</h5>
              <p class="small text-danger">${job.error_message || "Unknown error occurred"}</p>
            `;
          } else {
            statusArea.innerHTML = `
              <div class="spinner-border text-info mb-3" role="status"></div>
              <h5 class="text-info text-capitalize">Status: ${job.status}...</h5>
              <p class="small text-white-50">Please wait while the pipeline processes your video.</p>
            `;
          }
        } catch (e) {
          console.error("Polling error:", e);
        }
      }, 3000);
    }
  </script>
</body>
</html>
